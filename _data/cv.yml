    Projects:
      - name: Advanced 3D Underwater Wireless Power Transfer System for AUVs
        start_date: 2026-02
        end_date: present
        summary: "Research project on relay-coil-enhanced spatial underwater wireless power transfer for docking-free AUV charging."
        highlights:
          - "Designed and analyzed a 3D transmitter concept with relay coils for improved spatial power-transfer coverage."
          - "Modeled system behavior in MATLAB and evaluated efficiency and output power under different loads."
          - "Connected mechanical AUV design considerations with UWPT integration and transmitter-receiver communication."

      - name: Data-Driven Cutting Force Prediction for Smart Manufacturing
        start_date: 2025-05
        end_date: present
        summary: "Smart manufacturing research project using machine learning and data-driven methods to predict cutting forces in milling."
        highlights:
          - "Processed large-scale datasets from milling experiments and developed prediction models for dynamic cutting force estimation."
          - "Implemented Random Forest, XGBoost, and data-driven modeling approaches."

      - name: Adaptive Fuzzy Backstepping Control for a 3-DOF Delta Robot
        start_date: 2024
        end_date: 2024
        summary: "Designed and controlled a 3-DOF parallel robot under uncertainties using adaptive fuzzy logic and backstepping control."
        highlights:
          - "Developed the mechanical model and physical prototype."
          - "Reduced joint trajectory deviation and improved stability response compared with baseline control."

      - name: YOLOv5s-Based PPE Detection in Construction Sites
        start_date: 2023
        end_date: 2023
        summary: "Computer vision project for detecting personal protective equipment in construction environments."
        highlights:
          - "Built a 2,632-image dataset across 5 classes."
          - "Compared six activation functions in YOLOv5s and achieved the best performance using SiLU."

      - name: AGV-Based Virtual Simulation for Automated Warehouse Logistics
        start_date: 2025-03
        end_date: 2025-05
        summary: "Industrial simulation project for AGV/AMR logistics operation at VinFast Hai Phong."
        highlights:
          - "Created AutoCAD traffic-intersection sketches and simulated warehouse operations in Visual Components Premium 4.6."
          - "Analyzed AGV/AMR behavior and supported troubleshooting of simulation errors."

